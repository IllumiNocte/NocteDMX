name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-core:
    name: Native core tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Check hardware runner syntax
        run: python3 -m py_compile tests/hil/run_smoke.py tests/hil/run_s3_bench.py tests/hil/run_s3_rdm.py tests/hil/run_s3_discovery.py tests/hil/run_s3_load.py tests/hil/run_s3_pio_timing.py tests/hil/run_esp8266_load.py

      - name: Test hardware runner without hardware
        run: python3 -m unittest discover -s tests/hil -p 'test_*.py' -v

  arduino-lint:
    name: Arduino library lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run Arduino Lint
        uses: arduino/arduino-lint-action@v3
        with:
          compliance: strict
          library-manager: submit
          project-type: library

  esp8266-examples:
    name: ESP8266 examples
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Install ESP8266 core and example dependencies
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266@3.1.2
          arduino-cli lib install "Adafruit NeoPixel@1.15.2"

      - name: Compile all examples
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r sketch; do
            echo "::group::${sketch}"
            build_args=()
            if [[ "$sketch" == "extras/hil/ControllerSmoke/ControllerSmoke.ino" ]]; then
              build_args=(--build-path build/ci-esp8266-controller)
            fi
            arduino-cli compile \
              --fqbn esp8266:esp8266:generic \
              --library "$GITHUB_WORKSPACE" \
              --warnings all \
              "${build_args[@]}" \
              "$sketch"
            echo "::endgroup::"
          done < <(find examples extras/hil -name '*.ino' ! -path 'extras/hil/Esp32S3UartBench/*' -print | sort)

      - name: Guard ESP8266 RDM framing and handoff IRAM dependencies
        shell: bash
        run: |
          set -euo pipefail
          objdump="$(find "$HOME/.arduino15/packages/esp8266/tools" -name xtensa-lx106-elf-objdump -type f -print -quit)"
          python3 tests/hil/check_s3_iram.py --chip esp8266 --objdump "$objdump" \
            --elf build/ci-esp8266-controller/ControllerSmoke.ino.elf

      - name: Compile ESP8266 output-only load variant
        run: |
          arduino-cli compile --fqbn esp8266:esp8266:generic \
            --library "$GITHUB_WORKSPACE" --warnings all \
            --build-property "compiler.cpp.extra_flags=-DNOCTE_HIL_RDM=0 -DNOCTE_HIL_DIRECTION_PIN=255" \
            extras/hil/Esp8266LoadBench

  esp32s3-dmx:
    name: ESP32-S3 experimental DMX/RDM controller
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Install ESP32 core and example dependencies
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
          arduino-cli lib install "Adafruit NeoPixel@1.15.2"

      - name: Compile DMX examples and DMX/RDM UART bench
        shell: bash
        run: |
          set -euo pipefail
          for sketch in examples/DmxOutputFade examples/DmxInput examples/DmxNeoPixelInput \
            extras/hil/DmxInputSmoke extras/hil/Esp32S3UartBench; do
            echo "::group::${sketch}"
            arduino-cli compile \
              --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc \
              --library "$GITHUB_WORKSPACE" \
              --build-property compiler.cpp.extra_flags=-DNOCTE_HIL_DIRECTION_PIN=255 \
              --warnings all \
              "$sketch"
            echo "::endgroup::"
          done
      - name: Compile UART2 DMX/RDM bench
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc \
            --library "$GITHUB_WORKSPACE" \
            --build-path build/ci-s3-uart2 \
            --build-property "compiler.cpp.extra_flags=-DNOCTE_HIL_DIRECTION_PIN=255 -DNOCTE_HIL_UART_NUMBER=2" \
            --warnings all extras/hil/Esp32S3UartBench
      - name: Guard S3 timing ISR IRAM placement and flash dependencies
        shell: bash
        run: |
          set -euo pipefail
          objdump="$(find "$HOME/.arduino15/packages/esp32/tools" -name xtensa-esp32s3-elf-objdump -type f -print -quit)"
          python3 tests/hil/check_s3_iram.py --objdump "$objdump" \
            --elf build/ci-s3-uart2/Esp32S3UartBench.ino.elf
